{% extends "base.html" %}
{% block title %}자동 파싱{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold mb-6">자동 파싱</h1>

  <div class="bg-white rounded-lg shadow p-6">
    <form id="autoParseForm" enctype="multipart/form-data" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">템플릿 선택</label>
        <select name="template_id" class="w-full border rounded px-3 py-2" required>
          <option value="">-- 템플릿 선택 --</option>
          {% for t in templates_list %}
          <option value="{{ t.id }}">{{ t.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">PDF 파일</label>
        <input type="file" name="file" accept=".pdf" class="w-full border rounded px-3 py-2" required>
      </div>

      <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
        자동 파싱 시작
      </button>
    </form>
  </div>
</div>

<script>
document.getElementById('autoParseForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const formData = new FormData(this);
  const btn = this.querySelector('button[type="submit"]');
  btn.disabled = true;
  btn.textContent = '파싱 중...';

  try {
    const response = await fetch('/certificate/auto-parse', {
      method: 'POST',
      body: formData
    });
    if (response.redirected) {
      window.location.href = response.url;
    }
  } catch (err) {
    alert('파싱 중 오류 발생: ' + err.message);
    btn.disabled = false;
    btn.textContent = '자동 파싱 시작';
  }
});
</script>
{% endblock %}
