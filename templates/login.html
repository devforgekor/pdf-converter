{% extends "base.html" %}

{% block title %}인증 - PDF2Sheet{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">PDF2Sheet</h1>
        <p class="auth-subtitle">인증번호를 입력하세요</p>
        
        <form action="/login" method="post" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
            
            <div class="form-group">
                <input type="password" id="pin" name="pin" required autofocus 
                       placeholder="4자리 인증번호" maxlength="4"
                       pattern="[0-9]{4}" inputmode="numeric"
                       class="pin-input">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">입장</button>
        </form>
    </div>
</div>

<style>
.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 60vh;
}
.auth-card {
    background: white;
    padding: 2rem;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 320px;
    text-align: center;
}
.auth-title {
    font-size: 1.8rem;
    margin-bottom: 0.5rem;
    color: #333;
}
.auth-subtitle {
    color: #666;
    margin-bottom: 1.5rem;
}
.pin-input {
    width: 100%;
    padding: 1rem;
    font-size: 1.5rem;
    text-align: center;
    letter-spacing: 0.5rem;
    border: 2px solid #ddd;
    border-radius: 8px;
    box-sizing: border-box;
}
.pin-input:focus {
    outline: none;
    border-color: #4285F4;
}
</style>
{% endblock %}
