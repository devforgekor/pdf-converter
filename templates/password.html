{% extends "base.html" %}

{% block title %}비밀번호 입력 - PDF2Sheet{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="file-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>
        
        <h1 class="auth-title">암호화된 PDF</h1>
        <p class="auth-subtitle">{{ filename }}</p>
        <p class="auth-hint">이 파일은 비밀번호로 보호되어 있습니다.<br>비밀번호를 입력하세요.</p>
        
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        
        <form action="/upload-with-password" method="post" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
            
            <div class="form-group">
                <input type="password" id="password" name="password" required 
                       placeholder="PDF 비밀번호" autofocus
                       class="pin-input">
            </div>
            
            <div class="form-actions">
                <a href="/upload" class="btn btn-outline">취소</a>
                <button type="submit" class="btn btn-primary">업로드 및 변환</button>
            </div>
        </form>
    </div>
</div>

<style>
.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 60vh;
}
.auth-card {
    background: white;
    padding: 2rem;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 400px;
    text-align: center;
}
.auth-title {
    font-size: 1.5rem;
    margin-bottom: 0.5rem;
    color: #424a53;
}
.auth-subtitle {
    color: #656d76;
    margin-bottom: 0.5rem;
    font-size: 0.9rem;
    word-break: break-all;
}
.auth-hint {
    color: #656d76;
    font-size: 0.85rem;
    margin-bottom: 1.5rem;
    line-height: 1.5;
}
.file-icon {
    color: #9a6700;
    margin-bottom: 1rem;
}
.pin-input {
    width: 100%;
    padding: 1rem;
    font-size: 1.2rem;
    text-align: center;
    border: 2px solid #d1d9e0;
    border-radius: 8px;
    box-sizing: border-box;
}
.pin-input:focus {
    outline: none;
    border-color: #4285F4;
}
.form-actions {
    display: flex;
    gap: 1rem;
    margin-top: 1rem;
}
.form-actions .btn {
    flex: 1;
}
</style>
{% endblock %}
