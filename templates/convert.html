{% extends "base.html" %}

{% block title %}변환 설정 - PDF2Sheet{% endblock %}

{% block content %}
<div class="convert-container">
    <div class="convert-card">
        <h1 class="convert-title">변환 설정</h1>
        
        <div class="file-preview">
            <div class="file-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
            </div>
            <div class="file-details">
                <p class="file-name">{{ conversion.original_filename }}</p>
                <p class="file-size">{{ "%.1f"|format(conversion.file_size / 1024 / 1024) }} MB</p>
            </div>
        </div>
        
        <form action="/convert/{{ conversion.id }}" method="post" class="convert-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
            
            <div class="form-group">
                <label for="output_format">출력 형식</label>
                <select id="output_format" name="output_format" required>
                    <option value="excel" selected>Excel (.xlsx)</option>
                    <option value="sheets">Google 스프레드시트</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="pdf_type">PDF 유형 (선택사항)</label>
                <select id="pdf_type" name="pdf_type">
                    <option value="">자동 감지</option>
                    <option value="roster">명단</option>
                    <option value="receipt">영수증</option>
                    <option value="certificate">이수증</option>
                </select>
                <small>PDF 유형을 모르면 자동 감지에 맡겨주세요</small>
            </div>
            
            <div class="form-actions">
                <a href="/" class="btn btn-outline">취소</a>
                <button type="submit" class="btn btn-primary">변환 시작</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
